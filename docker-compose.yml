services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: haru
      POSTGRES_PASSWORD: haru
      POSTGRES_DB: haru
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haru"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
