name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (haru + haru_test)
        run: docker compose up -d --wait db
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Unit tests in a non-KST timezone
        run: npm run test:tz
      - run: npx next build

  e2e:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: docker compose up -d --wait db
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (mobile in America/Los_Angeles, desktop admin, axe + html-validate)
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose --profile app build
      - name: Start db + backend + frontend
        run: docker compose --profile app up -d --wait
      - name: Smoke test through the Next.js proxy
        run: |
          curl -fsS http://localhost:3000/ -o /dev/null
          curl -fsS http://localhost:3000/api/room | grep -q '701'
          curl -fsS -c cj -H 'content-type: application/json' \
            -d '{"email":"admin@haru.dev","password":"admin1234"}' http://localhost:3000/api/auth/login -o /dev/null
          curl -fsS -b cj http://localhost:3000/api/admin/dashboard -o /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs
